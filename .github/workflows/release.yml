name: Release APK

# ─────────────────────────────────────────────────────────────────────────────
# DISABLED FOR NOW.
#
# Manual trigger only (`workflow_dispatch`), so it never runs on its own. Uncomment
# the `push: tags` block to auto-release on version tags, or disable it entirely
# from the Actions tab.
#
# Signing: if the repo secrets below are set, the release APK + AAB are signed with
# your upload key; otherwise an unsigned release APK is produced. Required secrets:
#   KEYSTORE_BASE64     base64 of your .jks  (base64 -w0 upload.jks)
#   KEYSTORE_PASSWORD   keystore password
#   KEY_ALIAS           key alias
#   KEY_PASSWORD        key password
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish under (e.g. v0.1.0)"
        required: true
        default: "v0.0.0-dev"
  # Uncomment to auto-release whenever a v* tag is pushed:
  # push:
  #   tags:
  #     - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release (APK + AAB)
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Without these the release build ships an empty engine config, so EngineSource is
          # disabled and the app shows no marketplace listings (issue #36).
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_KEY: ${{ secrets.ENGINE_KEY }}
          EANDATA_KEY: ${{ secrets.EANDATA_KEY }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon

      - name: Build unsigned release APK (no keystore secret)
        if: env.KEYSTORE_BASE64 == ''
        env:
          ENGINE_URL: ${{ secrets.ENGINE_URL }}
          ENGINE_KEY: ${{ secrets.ENGINE_KEY }}
          EANDATA_KEY: ${{ secrets.EANDATA_KEY }}
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Stage artifacts
        id: stage
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          mkdir -p dist
          for f in app/build/outputs/apk/release/*.apk; do
            [ -e "$f" ] && cp "$f" "dist/valoo-${TAG}.apk"
          done
          for f in app/build/outputs/bundle/release/*.aab; do
            [ -e "$f" ] && cp "$f" "dist/valoo-${TAG}.aab"
          done
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.stage.outputs.tag }}
          name: Valoo ${{ steps.stage.outputs.tag }}
          files: dist/*
          generate_release_notes: true
